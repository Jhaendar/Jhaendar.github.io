<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - AI/ML Engineer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevents scrollbars */
            font-family: 'Inter', sans-serif;
        }
        .split-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .pane {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        /* Left Pane Styling (Now Text) */
        .left-pane {
            background-color: #1C1C1C; /* Original dark gray for text side */
            /* Pattern: Dot grid */
            background-image: radial-gradient(circle, #3A3A3A 1px, rgba(0,0,0,0) 1px);
            background-size: 20px 20px;
            color: #D1D1D1;
        }

        /* Right Pane Styling (Now Image) */
        .right-pane {
            background-color: #1A1A1A; /* Base color for image side, if image doesn't fully load/has transparency */
            padding: 0; /* Remove padding to allow image to cover edge-to-edge */
        }

        /* Styling for the image in the right pane */
        .hero-image {
            width: 100%; /* Cover full width of the pane */
            height: 100%; /* Cover full height of the pane */
            object-fit: cover; /* Crop image to cover, maintaining aspect ratio */
            display: block; /* Remove extra space below image if any */
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5em;
            color: #E0E0E0;
        }
        p.email {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 0.75em; /* Add some space before the new message */
            color: #A0A0A0;
        }
        p.tagline {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            color: #8892B0; /* A slightly different muted color */
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column-reverse; /* Image (right-pane) will now appear first when stacked */
            }
            .pane {
                width: 100%;
                height: 50%;
            }
            .left-pane { /* Text pane when stacked */
                 padding: 20px;
            }
            .right-pane { /* Image pane when stacked */
                /* padding: 0; already set */
            }
            h1 {
                font-size: 2rem;
            }
            p.email {
                font-size: 1rem;
            }
            p.tagline {
                font-size: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }
            p.email {
                font-size: 0.9rem;
            }
            p.tagline {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="pane left-pane">
            <div> <h1>[Jake Avila]</h1>
                <p class="email">[jmavila18.work@gmail.com]</p>
                <p class="tagline">I do AI stuff by the way.</p>
            </div>
        </div>

        <div class="pane right-pane">
            <img src="hero.png"
                 alt="Abstract AI visualization with light effects"
                 class="hero-image"
                 onerror="this.style.backgroundColor='#1A1A1A'; this.alt='Image loading failed.'; this.src='https://placehold.co/600x600/1A1A1A/A0A0A0?text=IMAGE+UNAVAILABLE';">
        </div>
    </div>
</body>
</html>
